[package]
name = "gmem_rust_memory_store"
version = "0.1.0"
edition = "2021"
authors = ["aspnmy <support@e2bank.cn>"]
description = "Rust implementation of Copilot Memory Store with high performance and type safety"
license = "MIT"
repository = "https://github.com/aspnmy/copilot-memory-store"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
getrandom = "0.2"
fastrand = "2.0"
tokio = { version = "1.0", features = ["full"], optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }
dirs = "5.0"

[features]
default = []
async = ["tokio"]
llm = ["reqwest"]
full = ["async", "llm"]

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "memory-store"
path = "src/main.rs"

[[bin]]
name = "memory-mcp-server"
path = "src/mcp_server.rs"
required-features = ["full"]

[lib]
name = "gmem_rust_memory_store"
path = "src/lib.rs"
